name: Backend CI

on:
  pull_request:
    branches:
      - develop
    paths:
      - "backend/**"
      - "docs/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches:
      - develop
    paths:
      - "backend/**"
      - "docs/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  build:
    name: Backend Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build backend
        run: npm run build
